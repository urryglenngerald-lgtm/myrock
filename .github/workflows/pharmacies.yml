name: Update Sunday pharmacies
on:
  schedule:
    - cron: "20 5 * * *"   # every morning, so a skipped run never leaves the roster stale
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  pharmacies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber
      - run: python scripts/update_pharmacies.py data/pharmacies.json
      - name: Save
        run: |
          if [ -n "$(git status --porcelain data/pharmacies.json)" ]; then
            git config user.name "myRock pharmacy bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/pharmacies.json
            git commit -m "Sunday pharmacies: roster updated"
            git push
          else
            echo "No change"
          fi
