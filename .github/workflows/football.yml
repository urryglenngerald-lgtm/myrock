name: Football tonight
on:
  schedule:
    - cron: "5 */2 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/fetch_football.py
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
      - run: |
          git config user.name "myRock bot"
          git config user.email "bot@myrockmalta.com"
          git add data/football.json
          git diff --cached --quiet || git commit -m "Football: tonight and tomorrow"
          git pull --rebase && git push
