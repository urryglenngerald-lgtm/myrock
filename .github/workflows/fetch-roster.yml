name: Fetch pharmacy roster files
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out
          for f in 7616 7609; do
            curl -sSL -A "Mozilla/5.0 myRock" -D out/headers-$f.txt -o out/file-$f.bin "https://medicinesauthority.gov.mt/file.aspx?f=$f"
          done
          ls -la out; file out/*
      - name: Save to a side branch (not deployed)
        run: |
          cd out
          git init -q -b roster-raw
          git config user.name "myRock bot"; git config user.email "actions@users.noreply.github.com"
          git add -A && git commit -qm "Raw roster files"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" roster-raw
