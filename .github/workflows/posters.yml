name: Fetch event posters
on:
  workflow_dispatch:
    inputs:
      ids:
        description: event ids (blank = all without poster)
        required: false
        default: ""
permissions:
  contents: write
jobs:
  posters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/fetch_posters.py ${{ inputs.ids }}
      - name: Save
        run: |
          git config user.name "myRock poster bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p images/posters/review && git add images/posters
          git diff --cached --quiet && echo "No change" || (git commit -m "Event posters fetched" && git push)
