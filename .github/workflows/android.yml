name: Build Android app
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Bubblewrap
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KS_PASS }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KS_PASS }}
        run: |
          test -n "$BUBBLEWRAP_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KS_PASS secret"; exit 1; }
          npm i -g @bubblewrap/cli
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME_17_X64\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          cd android
          yes | bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json
          export JAVA_HOME=$JAVA_HOME_17_X64
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease assembleRelease
          P="$BUBBLEWRAP_KEYSTORE_PASSWORD"
          AAB=$(ls app/build/outputs/bundle/release/*.aab | head -1)
          cp "$AAB" app-release-bundle.aab
          $JAVA_HOME/bin/jarsigner -keystore upload.jks -storepass "$P" -keypass "$P" -sigalg SHA256withRSA -digestalg SHA-256 app-release-bundle.aab myrock
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          $BT/zipalign -f -p 4 "$APK" aligned.apk
          $BT/apksigner sign --ks upload.jks --ks-pass pass:"$P" --key-pass pass:"$P" --ks-key-alias myrock --out app-release-signed.apk aligned.apk
          ls -la *.aab *.apk
      - name: Publish as a GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tag="android-$(date +%Y%m%d-%H%M)"
          gh release create "$tag" android/app-release-bundle.aab android/app-release-signed.apk --title "myRock Android $tag" --notes "Upload the .aab to Google Play Console."
