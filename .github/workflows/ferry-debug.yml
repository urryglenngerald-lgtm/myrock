name: Ferry debug (temporary)
on:
  workflow_dispatch: {}
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Linux; Android 14) myRock"
          echo "########## GOZO CHANNEL schedule page: ajax snippets"
          curl -sSL -m 25 -A "$UA" -o gc.html https://www.gozochannel.com/ferry/schedule/
          python3 - <<'PY'
          import re
          t=open('gc.html',encoding='utf-8',errors='ignore').read()
          for m in re.finditer(r'(?i)(ajax|schedule|sch=|trip|departure)', t):
              pass
          scripts=re.findall(r'(?s)<script[^>]*>(.*?)</script>',t)
          for s in scripts:
              if re.search(r'(?i)ajax|schedule|depart',s) and len(s)<8000:
                  print('--- inline script:', s.strip()[:1500])
          for src in re.findall(r'<script[^>]+src="([^"]+)"',t):
              print('src', src)
          i=t.find('Current Ferry Schedule'); print('--- around schedule html:', re.sub(r'\s+',' ',t[i:i+3000]))
          PY
          echo "########## GOZO HIGHSPEED bundle"
          curl -sSL -m 25 -A "$UA" -o hs.html https://gozohighspeed.com/
          grep -oE 'src="[^"]+\.js"' hs.html
          for js in $(grep -oE '/static/js/[^"]+\.js' hs.html | sort -u); do
            curl -sSL -m 25 -A "$UA" -o b.js "https://gozohighspeed.com$js"
            echo "== $js $(wc -c < b.js) bytes"
            grep -oE 'https?://[a-zA-Z0-9./_-]+' b.js | sort -u | grep -viE 'w3.org|reactjs|github|mozilla|google-analytics|googletag|facebook|schema.org' | head -40
            grep -oE '"/?api/[^"]{0,80}"|`/?api/[^`]{0,80}`|"/[a-z]+/(timetable|schedule|trips|departures)[^"]{0,60}"' b.js | sort -u | head -40
            grep -oiE '.{80}(timetable|schedule)[^,;]{0,80}' b.js | head -15
          done
