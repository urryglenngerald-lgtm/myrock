name: Ferry debug (temporary)
on:
  workflow_dispatch: {}
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Linux; Android 14) myRock"
          echo "########## GC main js"
          for u in "https://www.gozochannel.com/wp-content/themes/gozochannel/dist/scripts/main_0d42ae1f.js" "https://www.gozochannel.com/wp-content/plugins/gc-functionality/js/gc-ts.js?ver=1.0.9"; do
            curl -sSL -m 25 -A "$UA" -o m.js "$u"; echo "== $u $(wc -c < m.js)"
            grep -oiE '.{120}(schedule|admin-ajax|action:|action=|get_trips|days)[^;]{0,160}' m.js | head -25
          done
          echo "########## HS bundle"
          curl -sSL -m 25 -A "$UA" -o b.js "https://gozohighspeed.com/assets/index-DwzXZidQ.js"; echo "size $(wc -c < b.js)"
          grep -oE 'https?://[a-zA-Z0-9./_:-]+' b.js | sort -u | grep -viE 'w3.org|reactjs|github|mozilla|googletag|facebook|schema.org|fb.me|unpkg|jsdelivr' | head -40
          grep -oiE '.{100}(timetable|schedule|/trips|departures|baseURL|apiUrl|api_url)[^;]{0,140}' b.js | head -25
