name: Ferry debug (temporary)
on:
  workflow_dispatch: {}
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Linux; Android 14) myRock"
          curl -sSL -m 25 -A "$UA" -o m.js "https://www.gozochannel.com/wp-content/themes/gozochannel/dist/scripts/main_0d42ae1f.js"
          curl -sSL -m 25 -A "$UA" -o b.js "https://gozohighspeed.com/assets/index-DwzXZidQ.js"
          python3 - <<'PY'
          import re
          t=open('m.js',encoding='utf-8',errors='ignore').read()
          for m in re.finditer(r'getScheduleJsonUrl\s*[=(:]', t):
              print('GC FN >>', t[m.start()-100:m.start()+900].replace('\n',' ')); print()
          b=open('b.js',encoding='utf-8',errors='ignore').read()
          i=b.find('cte=[{d:"05:45"')
          j=b.find('}]', b.find('sn2=') if False else i)
          chunk=b[i-200:i+9000]
          print('HS ARRAYS >>', chunk)
          for name in ['cte','ste','ote']:
              for m in re.finditer(r'[^A-Za-z0-9_$]'+name+r'[^A-Za-z0-9_$=]', b):
                  if abs(m.start()-i)>9000:
                      print('USE',name,'>>', b[m.start()-500:m.start()+300]); print()
                      break
          PY
