name: Ferry debug (temporary)
on:
  workflow_dispatch: {}
jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Linux; Android 14) myRock"
          for d in 2026/11/19 2026/11/22 2026/12/25; do echo "GCJSON $d"; curl -sSL -m 25 -A "$UA" "https://static.gozochannel.com/schedules/$d/passenger.json" | head -c 2500; echo; done
          curl -sSL -m 25 -A "$UA" -o b.js "https://gozohighspeed.com/assets/index-DwzXZidQ.js"
          python3 - <<'PY'
          import re
          b=open('b.js',encoding='utf-8',errors='ignore').read()
          for m in re.finditer(r'vi,\{title:"([^"]*)",columns:(\[.*?\]),accessibleDescription:"([^"]*)"', b):
              print('VI >>', m.group(1),'|', m.group(2),'|', m.group(3))
          names=re.findall(r'[,;\s](\w{2,4})=\[\{d:"', b)
          print('ARRAYS', names)
          i=b.find('id:"schedule-note-1"'); print('NOTES >>', b[i-60:i+900])
          PY
